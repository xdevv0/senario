<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيناريو - Scenario Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-color: #000000; 
            --card-bg: #0a0a0a; 
            --text-color: #ffffff; 
            --text-muted: #888888; 
            --border-color: rgba(255, 255, 255, 0.15); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5%; z-index: 1000; 
        }

        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-container img { height: 40px; object-fit: contain; filter: invert(1); }
        .logo-text { font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 1px; }
        
        .social-icons-header { display: flex; gap: 15px; align-items: center; }
        .social-icons-header a { color: #fff; font-size: 1.2rem; transition: 0.3s; }
        .social-icons-header a:hover { color: var(--text-muted); transform: scale(1.1); }

        .main-content { padding: 160px 5% 80px; max-width: 700px; margin: 0 auto; width: 100%; text-align: center; flex-grow: 1; }

        .hero-logo { width: 140px; height: 140px; margin: 0 auto 25px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; padding: 15px; box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .hero-logo img { width: 100%; height: 100%; object-fit: contain; }

        .brand-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; color: #fff; }
        .brand-desc { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 40px; line-height: 1.6; }

        .links-container { display: flex; flex-direction: column; gap: 18px; width: 100%; }

        .social-link-btn {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 16px 25px; border-radius: 12px; color: #fff;
            text-decoration: none; font-weight: 700; font-size: 1.1rem;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .social-link-btn span { display: flex; align-items: center; gap: 15px; }
        .social-link-btn i { font-size: 1.4rem; }
        .social-link-btn .fa-arrow-left { font-size: 0.9rem; color: var(--text-muted); transition: 0.3s; }

        .social-link-btn:hover {
            background: #fff; color: #000; border-color: #fff;
            transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,255,255,0.15);
        }
        .social-link-btn:hover .fa-arrow-left { color: #000; transform: translateX(-5px); }

        footer { text-align: center; padding: 25px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; background: #000; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <img src="senario.png" alt="سيناريو Logo">
            <span class="logo-text">SCENARIO</span>
        </a>
        <div class="social-icons-header">
            <a href="https://www.facebook.com/share/1AuWwwtbZd/?mibextid=wwXIfr" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/sinariomedia?stkn=MTJraHVteGI0aXJreA==" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://wa.me/972594174456" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </header>

    <div class="main-content">
        <div class="hero-logo">
            <img src="senario.png" alt="سيناريو Logo">
        </div>
        
        <h1 class="brand-title">سيناريو | Scenario Media</h1>
        <p class="brand-desc">نصنع محتوى بفرادة، نروي قصصكم ونوثق رؤيتكم بإنتاج إعلامي وفني احترافي.</p>

        <div class="links-container">
            <!-- رابط الواتساب -->
            <a href="https://wa.me/972594174456" target="_blank" class="social-link-btn">
                <span><i class="fa-brands fa-whatsapp" style="color: #25d366;"></i> مراسلة عبر الواتساب</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- رابط الفيسبوك -->
            <a href="https://www.facebook.com/share/1AuWwwtbZd/?mibextid=wwXIfr" target="_blank" class="social-link-btn">
                <span><i class="fa-brands fa-facebook" style="color: #1877f2;"></i> صفحتنا على الفيسبوك</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- رابط الانستغرام -->
            <a href="https://www.instagram.com/sinariomedia?stkn=MTJraHVteGI0aXJreA==" target="_blank" class="social-link-btn">
                <span><i class="fa-brands fa-instagram" style="color: #e4405f;"></i> حسابنا على الإنستغرام</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 Scenario Media</p>
    </footer>

</body>
</html>
